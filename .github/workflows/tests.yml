name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Data gates, relevance and bun tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # validate:csv, validate:data, validate:agent-guide, validate:catalog-summary,
      # bun test (tests/ and the sub-skill tests), the relevance gate and both smoke suites.
      - name: Run the aggregate offline gate
        run: bun run verify

      - name: Install, test and build the gallery
        working-directory: gallery
        run: |
          bun install
          bun run test
          bun run build
